program: Week3/main_from_scratch_gridsearch.py

method: grid

metric:
  name: val/accuracy
  goal: maximize

parameters:
  head_depth:
    values: ["mlp"]

  use_batchnorm:
    values: [true]

  hidden_dim:
    values: [256]

  dropout:
    values: [0.2]

  lr:
    values: [3e-4]

  batch_size:
    values: [64]

  input_size:           
    values: [350]

  patience:
    values: [2]
